name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria a11y y rendimiento
        run: |
          npm start -- -p 3100 &
          npx --yes wait-on http://localhost:3100/es
          npm run audit:a11y
          npm run audit:perf
